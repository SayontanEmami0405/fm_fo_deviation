# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.emami.fmfodeviation
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: EDS
          url: http://ppcuser:443
        app: 
          name: ZFMFODEVAPP
          description: FM FO Deviation
          package: ZEMAMI
          transport: EDSK9B06U8
        exclude:
          - /test/
